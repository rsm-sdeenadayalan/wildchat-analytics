<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}} — Loupe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2713%27 cy=%2713%27 r=%279%27 fill=%27none%27 stroke=%27%232b5cd9%27 stroke-width=%273%27/%3E%3Cline x1=%2720%27 y1=%2720%27 x2=%2729%27 y2=%2729%27 stroke=%27%232b5cd9%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
<link rel="stylesheet" href="../styles.css" />
<style>
  .doc { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .doc h1 { font-size: 30px; line-height: 1.2; margin-top: 8px; }
  .doc h2 { margin-top: 32px; font-size: 21px; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .doc pre { background: var(--card); border: 1px solid var(--line); padding: 12px; overflow-x: auto; border-radius: 6px; }
  .doc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .doc blockquote { border-left: 3px solid var(--accent); margin: 0; padding-left: 14px; color: var(--muted); }
  .docnav { max-width: 760px; margin: 0 auto; padding: 12px 16px 0; display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .docnav a { color: var(--accent); text-decoration: none; }
  .docnav a.current { font-weight: 600; text-decoration: underline; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="../">Loupe</a><span class="tag">case study</span><a class="docs-link" href="../">Dashboard →</a></div></header>
<nav class="docnav">{{nav}}</nav>
<article class="doc">{{body}}</article>
</body>
</html>
