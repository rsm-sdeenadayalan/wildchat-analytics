<script>
  // Short anchors: #f3 scrolls to the heading whose generated id starts with "f3-".
  (function () {
    var m = /^#(f\d+)$/.exec(location.hash);
    if (!m) return;
    var h = document.querySelector('[id^="' + m[1] + '-"]');
    if (h) h.scrollIntoView();
  })();
</script>
